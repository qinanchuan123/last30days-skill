name: last30days weekly brief

on:
  schedule:
    # 每周一 00:00 UTC（北京时间周一 08:00）
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      topics:
        description: '要跑的选题：all / ai / finance / tech'
        required: true
        default: 'all'
      quick:
        description: 'true=快速模式（样本少），false=完整模式'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: last30days-weekly
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    env:
      LAST30DAYS_PYTHON: python3
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install optional YouTube tool
        run: pip install --quiet yt-dlp || true

      - name: Generate weekly briefs
        env:
          TOPIC_SET: ${{ inputs.topics }}
          QUICK: ${{ inputs.quick }}
        run: |
          set -uo pipefail
          TOPIC_SET="${TOPIC_SET:-all}"
          QUICK="${QUICK:-false}"
          DATE="$(date -u +%F)"
          OUT="reports/${DATE}"
          mkdir -p "$OUT"
          declare -A TOPICS=(
            [ai]="AI agent tools and model releases"
            [finance]="stock market and macro outlook"
            [tech]="big tech product and industry news"
          )
          for KEY in ai finance tech; do
            if [ "$TOPIC_SET" != "all" ] && [ "$TOPIC_SET" != "$KEY" ]; then
              continue
            fi
            TOPIC="${TOPICS[$KEY]}"
            echo "== ${KEY}: ${TOPIC}"
            ARGS=()
            if [ "$QUICK" = "true" ]; then ARGS+=(--quick); fi
            python3 skills/last30days/scripts/last30days.py "$TOPIC" "${ARGS[@]}" \
              --emit md --output "$OUT/${KEY}.md" \
              || echo "::warning::${KEY} run returned non-zero"
          done
          ls -la "$OUT" || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: last30days-brief-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "report: weekly brief $(date -u +%F)"
          git push || true
